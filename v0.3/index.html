<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Infinite Tower</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Cinzel:wght@600;700;800&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>
<header id="hdr">
  <h1>INFINITE TOWER <span class="ver">v0.9</span></h1>
  <div class="hstats">
    <span>💰 <b id="h-gold">0</b></span>
    <span>🎟️ <b id="h-permit">0</b></span>
    <span>🪦 <b id="h-mem">0</b></span>
    <button id="h-snd" class="hsnd" type="button" aria-label="toggle sound">🔊</button>
  </div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toasts"></div>
<div id="overlay" class="hidden"></div>
<div id="splash">
  <div class="sp-torch sp-l"></div>
  <div class="sp-torch sp-r"></div>
  <div class="sp-kicker">A TOWER · A MASTER · HEROES WHO CAN DIE</div>
  <div class="sp-logo">INFINITE<br>TOWER</div>
  <div class="sp-sub">climb · lose them · remember them</div>
  <div class="sp-tap">— TAP TO ENTER —</div>
  <div class="sp-ver">v0.25 — PROTAGONISTS</div>
</div>
<script src="js/sound.js?v=33"></script>
<script src="js/core.js?v=33"></script>
<script src="js/map.js?v=33"></script>
<script src="js/events.js?v=33"></script>
<script src="js/scene.js?v=33"></script>
<script src="js/combat.js?v=33"></script>
<script src="js/ui.js?v=33"></script>
<script>
/* V0.9.4: title splash — the tap that enters ALSO unlocks audio (autoplay
   policy) and starts the town loop. Removed from the DOM after the fade. */
(function(){
  var sp=document.getElementById('splash');
  if(!sp) return;
  var done=false;
  sp.addEventListener('click',function(){
    if(done) return; done=true;
    try{ if(window.IT&&IT.snd) IT.snd.music('lobby'); }catch(e){}
    sp.className='out';
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },650);
  });
})();
</script>
</body>
</html>
