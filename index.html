<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Tower</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>
:root{
  --bg:#0b0d12; --card:#141822; --card2:#1b2130; --line:#262d3d;
  --txt:#d7dce6; --dim:#8b94a7; --gold:#e8b04b; --red:#e05263;
  --green:#5fbf77; --blue:#5aa2e8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:70px}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;background:var(--card)}
header h1{font-size:19px;letter-spacing:2px;font-family:Cinzel,Georgia,serif}
header h1 span{color:var(--gold);font-size:12px;margin-left:8px}
.hstat{color:var(--dim);font-size:14px}
.hstat b{color:var(--txt)}
nav{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line)}
nav button{background:none;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;color:var(--dim);padding:8px 16px;font-size:14px;cursor:pointer}
nav button.on{color:var(--txt);background:var(--card);border-color:var(--card2)}
main{padding:18px;max-width:1060px;margin:0 auto}
h2{font-size:15px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:10px;padding:12px 14px;cursor:pointer;transition:transform .06s}
.card:hover{transform:translateY(-2px)}
.card.inparty{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.card .nm{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.card .sub{color:var(--dim);font-size:13px;margin:2px 0 6px}
.stars{color:var(--gold);letter-spacing:1px}
.r1{color:#9aa3b2}.r2{color:#7ec97e}.r3{color:var(--blue)}.r4{color:var(--gold)}
.stars.r1{color:#9aa3b2}.stars.r2{color:#7ec97e}.stars.r3{color:var(--blue)}.stars.r4{color:var(--gold)}
.cWarrior{border-left-color:#d98e3f}.cTank{border-left-color:#7f8fa6}.cRogue{border-left-color:#7ec97e}.cMage{border-left-color:#9b6ee8}.cHealer{border-left-color:#5fd4e0}
.bar{height:7px;background:#0a0c10;border-radius:4px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.low{background:var(--red)}
.bar.xp i{background:var(--blue)}
.stats{display:flex;gap:10px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.stats b{color:var(--txt)}
.ptag{font-size:12px;color:var(--dim);margin-top:6px;font-style:italic}
button.act{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px}
button.act:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button.act:disabled{opacity:.4;cursor:not-allowed}
button.big{font-size:16px;padding:12px 26px;background:#20283a}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.hint{color:var(--dim);font-size:13.5px;margin:8px 0}
.floorgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer}
.fl:hover:not(.lock){border-color:var(--gold)}
.fl .fn{font-size:20px;font-weight:800}
.fl .fd{color:var(--dim);font-size:12px;margin-top:3px}
.fl.done{border-color:var(--green)} .fl.done .fd{color:var(--green)}
.fl.lock{opacity:.35;cursor:not-allowed}
.fl.wall{border-color:var(--red);background:#1d1216}
.fl.wall .fn{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px}
.panel h3{font-size:13px;color:var(--gold);letter-spacing:1px;margin-bottom:8px}
.kv{color:var(--dim);font-size:13.5px}.kv b{color:var(--txt)}
.unknown{color:var(--red);font-style:italic}
/* battle */
#battle{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:12px 16px;overflow:auto}
#battle.hidden{display:none}
.b-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.b-top .bf{font-size:17px;font-weight:800;letter-spacing:1px}
.b-mid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 0}
@media(max-width:700px){.b-mid{grid-template-columns:1fr}}
.b-col{display:flex;flex-direction:column;gap:8px}
.bunit{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.bunit .u1{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bunit.marked{border-color:var(--red);box-shadow:0 0 0 1px var(--red);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 8px 2px var(--red)}}
@media(prefers-reduced-motion:reduce){.bunit.marked{animation:none}#intro .box{animation:none}}
.bunit.dead{opacity:.35;filter:grayscale(1)}
.uhp{color:var(--dim);font-size:12px}
#b-log{flex:1;min-height:140px;background:#080a0e;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-y:auto;white-space:pre-wrap}
#b-log .sys{color:var(--gold)} #b-log .bad{color:var(--red)} #b-log .good{color:var(--green)} #b-log .dim{color:var(--dim)}
#b-result{margin-top:12px;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:16px}
#b-result.hidden{display:none}
#b-result h3{color:var(--gold);font-size:18px;margin-bottom:8px}
#b-result .dead-line{color:var(--red)}
/* toasts */
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--card2);border:1px solid var(--gold);color:var(--txt);border-radius:8px;padding:10px 14px;font-size:13.5px;max-width:300px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* intro */
#intro{position:fixed;inset:0;background:rgba(5,6,10,.96);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
#intro.hidden{display:none}
#intro .box{max-width:520px;text-align:center}
#intro h1{font-size:26px;letter-spacing:4px;margin-bottom:14px;font-family:Cinzel,Georgia,serif}
#intro p{color:var(--dim);margin:10px 0;font-size:15px}
#intro .warn{color:var(--red)}
.mem{border-left-color:var(--line)!important;cursor:default}
.mem .nm{color:var(--dim)}
.mem .dead-tag{color:var(--red);font-size:12px;font-weight:700}
.rar-note{font-size:12px;color:var(--dim);margin-top:4px}
.spd button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px;margin-left:4px}
.spd button.on{color:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>

<header>
  <h1>INFINITE TOWER <span id="ver">v0.2 — "The Wall"</span></h1>
  <span class="hstat">💰 <b id="h-gold">0</b> Gold</span>
  <span class="hstat">🎟️ <b id="h-permit">0</b> Permits</span>
  <span class="hstat">🪦 <b id="h-mem">0</b> Lost</span>
</header>
<nav id="nav">
  <button data-t="lobby" class="on">Lobby</button>
  <button data-t="recruit">Recruit</button>
  <button data-t="tower">Tower</button>
  <button data-t="memorial">Memorial</button>
</nav>
<main id="app"></main>

<div id="battle" class="hidden">
  <div class="b-top">
    <span class="bf" id="b-floor"></span>
    <span class="spd" id="b-controls">
      <button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button><button data-s="16">≫</button>
      <button id="b-retreat" style="color:var(--red);border-color:var(--red);margin-left:12px">Retreat</button>
    </span>
  </div>
  <div class="b-mid">
    <div class="b-col" id="b-party"></div>
    <div class="b-col" id="b-enemies"></div>
  </div>
  <div id="b-log"></div>
  <div id="b-result" class="hidden"></div>
</div>

<div id="toasts"></div>

<div id="intro" class="hidden">
  <div class="box">
    <h1>INFINITE TOWER</h1>
    <p>You are the <b style="color:var(--gold)">Master</b>. You do not fight.</p>
    <p>You recruit. You command. You bury.</p>
    <p class="warn">Heroes who fall in the Tower are gone. Forever.</p>
    <p>Floor 10 is called <b style="color:var(--red)">The Wall</b>.<br>No one has come back to explain why.</p>
    <button class="act big" id="intro-go">I UNDERSTAND</button>
  </div>
</div>

<script>
'use strict';
/* ============================== DATA ============================== */
const NAMES=['Mira','Kael','Rook','Sera','Dain','Ilya','Bram','Nyx','Odell','Petra','Silas','Vera','Corin','Wren','Halden','Juno','Fen','Maro','Lys','Tobin','Ash','Rin','Garrick','Elva','Moss','Kira','Dorn','Sable','Pip','Yara'];
const PERSONALITIES={
  Brave:'Fights harder at death\'s door.',
  Coward:'May freeze when fear takes hold.',
  Greedy:'+10% damage. They came for the loot.',
  Loyal:'Avenges fallen allies (+20% dmg).',
  Reckless:'+15% damage dealt, +10% taken.',
  Cautious:'Takes 10% less damage.'
};
const CLASSES={
  Warrior:{icon:'⚔️',hp:120,atk:22,def:12,agi:10,desc:'Power Strike: 30% chance for 180% dmg.'},
  Tank:{icon:'🛡️',hp:185,atk:15,def:20,agi:6,desc:'Draws enemy attacks. 30% chance to intercept a hit for an ally.'},
  Rogue:{icon:'🗡️',hp:90,atk:26,def:6,agi:20,desc:'Targets the weakest foe. 25% crit for 170%.'},
  Mage:{icon:'🔮',hp:80,atk:30,def:5,agi:12,desc:'Fireball: 40% chance to hit ALL enemies for 65%.'},
  Healer:{icon:'✨',hp:95,atk:14,def:8,agi:11,desc:'Heals the most wounded ally each turn.'}
};
const RARITY_MULT={1:.82,2:1,3:1.25,4:1.5};
const GACHA_RATES=[[1,.55],[2,.28],[3,.13],[4,.04]];
const MOBS=['Plague Rat','Cave Bat','Goblin Scrapper','Dire Wolf','Bandit','Rattling Skeleton','Orc Raider','Tower Cultist','Flesh Ogre'];
const EPITAPHS=[
  'They went up. They did not come down.',
  'The Tower keeps what it takes.',
  'Somewhere below, a candle burns out.',
  'The Tower remembers.',
  'Their name still echoes in the stairwell.',
  'The Tower was hungrier today.'
];
const RECRUIT_COST=120;

/* ============================== STATE ============================== */
const KEY='infinite_tower_v02';
let S=null;      // persistent state
let B=null;      // active battle (not persisted)

function newGame(){
  return {gold:250,permits:3,nextId:1,heroes:[],memorial:[],party:[],
          cleared:{},knowledge:{executioner:false,wallBroken:false,firstBlood:false},seenIntro:false};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadSave(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.heroes))return d;}catch(e){}
  return null;
}
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ============================== HERO ============================== */
function rollRarity(){const r=Math.random();let acc=0;for(const[star,p]of GACHA_RATES){acc+=p;if(r<acc)return star;}return 1;}
function unusedName(){
  const used=new Set(S.heroes.map(h=>h.name).concat(S.memorial.map(m=>m.name)));
  const free=NAMES.filter(n=>!used.has(n));
  return free.length?pick(free):pick(NAMES)+' II';
}
function makeHero(){
  const star=rollRarity(),cls=pick(Object.keys(CLASSES)),C=CLASSES[cls],m=RARITY_MULT[star];
  const v=()=>rnd(.92,1.08);
  const h={id:S.nextId++,name:unusedName(),cls,rarity:star,lvl:1,exp:0,
    maxHp:Math.round(C.hp*m*v()),atk:Math.round(C.atk*m*v()),def:Math.round(C.def*m*v()),agi:Math.round(C.agi*v()),
    loyalty:ri(50,90),fear:ri(5,30),personality:pick(Object.keys(PERSONALITIES)),
    kills:0,floors:0};
  h.hp=h.maxHp;
  return h;
}
function expNeed(lvl){return 60+45*lvl;}
function grantExp(h,amount){
  let gained=0;
  h.exp+=amount;
  while(h.exp>=expNeed(h.lvl)){
    h.exp-=expNeed(h.lvl);h.lvl++;gained++;
    h.maxHp=Math.round(h.maxHp*1.10);h.atk=Math.round(h.atk*1.09);
    h.def=Math.round(h.def*1.06);h.agi=Math.round(h.agi*1.03)+1;
    h.hp=Math.min(h.maxHp,h.hp+30);
  }
  return gained;
}
function starsHtml(h){return '<span class="stars r'+h.rarity+'">'+'★'.repeat(h.rarity)+'</span>';}
function heroCard(h,opts){
  opts=opts||{};
  const pct=Math.round(h.hp/h.maxHp*100);
  const inP=S.party.includes(h.id);
  return '<div class="card c'+h.cls+(inP?' inparty':'')+(opts.mem?' mem':'')+'" data-id="'+h.id+'">'+
    '<div class="nm"><span>'+CLASSES[h.cls].icon+' '+h.name+'</span>'+starsHtml(h)+'</div>'+
    '<div class="sub">Lv.'+h.lvl+' '+h.cls+(opts.mem?' — <span class="dead-tag">FALLEN</span>':'')+'</div>'+
    '<div class="bar"><i class="'+(pct<35?'low':'')+'" style="width:'+pct+'%"></i></div>'+
    '<div class="stats"><span>HP <b>'+Math.max(0,Math.round(h.hp))+'/'+h.maxHp+'</b></span><span>ATK <b>'+h.atk+'</b></span><span>DEF <b>'+h.def+'</b></span><span>AGI <b>'+h.agi+'</b></span></div>'+
    '<div class="stats" style="margin-top:3px"><span>Loyalty <b>'+h.loyalty+'</b></span><span>Fear <b>'+h.fear+'%</b></span><span>Kills <b>'+h.kills+'</b></span></div>'+
    '<div class="ptag">'+h.personality+' — '+PERSONALITIES[h.personality]+'</div>'+
    (opts.extra||'')+'</div>';
}

/* ============================== UI ROUTER ============================== */
let TAB='lobby';
function go(t){TAB=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
function renderHeader(){
  $('h-gold').textContent=S.gold;
  $('h-permit').textContent=S.permits;
  $('h-mem').textContent=S.memorial.length;
}
function render(){
  renderHeader();
  const app=$('app');
  if(TAB==='lobby')renderLobby(app);
  else if(TAB==='recruit')renderRecruit(app);
  else if(TAB==='tower')renderTower(app);
  else renderMemorial(app);
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.innerHTML=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .5s';setTimeout(()=>t.remove(),500);},3800);
}

/* ============================== LOBBY ============================== */
function renderLobby(app){
  const party=S.heroes.filter(h=>S.party.includes(h.id));
  const missing=S.heroes.reduce((s,h)=>s+(h.maxHp-h.hp),0);
  const restCost=Math.ceil(missing*0.4);
  let html='<h2>Lobby</h2>';
  if(!S.heroes.length){
    html+='<p class="hint">No heroes yet. The Tower does not climb itself.</p>'+
          '<div class="rowbtns"><button class="act big" id="go-recruit">🎴 Recruit your first hero</button></div>';
  }else{
    html+='<div class="rowbtns">'+
      '<button class="act" id="rest" '+((missing<1||S.gold<restCost)?'disabled':'')+'>💤 Rest &amp; Treat wounds — '+restCost+'g ('+Math.round(missing)+' HP missing, Fear −25)</button>'+
      '<button class="act" id="to-tower">🏰 Enter the Tower</button></div>'+
      '<p class="hint">Party: <b>'+party.length+'/3</b> — click a hero to add / remove from party.</p>'+
      '<div class="grid">'+S.heroes.map(h=>heroCard(h)).join('')+'</div>';
  }
  app.innerHTML=html;
  const gr=$('go-recruit');if(gr)gr.onclick=()=>go('recruit');
  const tt=$('to-tower');if(tt)tt.onclick=()=>go('tower');
  const rt=$('rest');
  if(rt)rt.onclick=()=>{
    S.gold-=restCost;
    S.heroes.forEach(h=>{h.hp=h.maxHp;h.fear=clamp(h.fear-25,0,100);});
    save();render();toast('💤 The party rests. Wounds close. Nerves settle.');
  };
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    const id=+c.dataset.id;
    if(S.party.includes(id))S.party=S.party.filter(x=>x!==id);
    else if(S.party.length<3)S.party.push(id);
    else toast('Party is full (3).');
    render();
  });
}

/* ============================== RECRUIT ============================== */
function doRecruit(){
  let used='🎟️ 1 Permit';
  if(S.permits>0)S.permits--;
  else if(S.gold>=RECRUIT_COST){S.gold-=RECRUIT_COST;used=RECRUIT_COST+' Gold';}
  else{toast('Need 1 Permit or '+RECRUIT_COST+' Gold.');return null;}
  const h=makeHero();
  S.heroes.push(h);save();
  return {h,used};
}
function renderRecruit(app){
  app.innerHTML='<h2>Recruit Hero</h2>'+
    '<p class="hint">Rates — <span class="r1">★ 55%</span> · <span class="r2" style="color:#7ec97e">★★ 28%</span> · <span class="r3" style="color:var(--blue)">★★★ 13%</span> · <span class="r4" style="color:var(--gold)">★★★★ 4%</span><br>'+
    'Low stars are cheap and stubborn. High stars are strong and expensive to bury.</p>'+
    '<div class="rowbtns"><button class="act big" id="rec">🎴 Recruit — 1 Permit (or '+RECRUIT_COST+'g)</button></div>'+
    '<div id="rec-result"></div>'+
    (S.heroes.length?'<h2 style="margin-top:24px">Roster ('+S.heroes.length+')</h2><div class="grid">'+S.heroes.map(h=>heroCard(h)).join('')+'</div>':'');
  $('rec').onclick=()=>{
    const r=doRecruit();
    if(!r)return;
    renderHeader();
    $('rec-result').innerHTML='<div class="panel"><h3>New Recruit ('+r.used+')</h3>'+
      heroCard(r.h,{extra:''})+'</div>';
    render();
    // re-show result after render() wiped it
    $('rec-result').innerHTML='<div class="panel"><h3>New Recruit ('+r.used+')</h3>'+
      '<div class="grid">'+heroCard(r.h)+'</div></div>';
    toast('🎴 '+r.h.name+' joins — '+'★'.repeat(r.h.rarity));
  };
}

/* ============================== TOWER ============================== */
function renderTower(app){
  let html='<h2>The Tower</h2><div class="floorgrid">';
  for(let n=1;n<=10;n++){
    const unlocked=n===1||S.cleared[n-1];
    const done=S.cleared[n];
    const wall=n===10;
    html+='<div class="fl'+(wall?' wall':'')+(done?' done':'')+(unlocked?'':' lock')+'" data-n="'+n+'">'+
      '<div class="fn">'+(wall?'F10 — THE WALL':'Floor '+n)+'</div>'+
      '<div class="fd">'+(done?'✓ Cleared':unlocked?(wall?'No one returns':'Enter'):'Locked')+'</div></div>';
  }
  html+='</div>';
  if(S.knowledge.executioner){
    html+='<div class="panel"><h3>📖 Tower Analysis — Floor 10</h3>'+
      '<p class="kv">Boss: <b>THE EXECUTIONER</b> — its cleaver sweeps the whole party every turn. The chip never stops.</p>'+
      '<p class="kv">Known mechanic — <b>"Execution"</b>: every 3rd turn the boss marks prey, then the axe falls on the marked hero.<br>'+
      'The mark only fizzles if the marked hero is at <b>100% HP</b> when the axe falls — then it bites, but does not kill.<br>'+
      'A Healer can top off exactly one hero per turn. Choose who lives at the mark.</p>'+
      '<p class="kv">'+(S.knowledge.wallBroken
        ?'<b style="color:var(--green)">Your Healer now knows:</b> prioritize the marked. Keep everyone topped. The Wall breaks.'
        :'<span class="unknown">??? — your survivors cannot explain what they saw.</span>')+'</p></div>';
  }else{
    html+='<div class="panel"><h3>📖 Tower Analysis</h3><p class="kv">Floors 1–9: hostile fauna and worse.<br>Floor 10: <span class="unknown">no data. no survivors.</span></p></div>';
  }
  html+='<p class="hint">Party of '+S.party.length+'/3. Deaths are permanent.</p>';
  app.innerHTML=html;
  app.querySelectorAll('.fl:not(.lock)').forEach(f=>f.onclick=()=>{
    if(!S.party.length){toast('Pick a party in the Lobby first.');go('lobby');return;}
    startFloor(+f.dataset.n);
  });
}

/* ============================== MEMORIAL ============================== */
function renderMemorial(app){
  app.innerHTML='<h2>Memorial</h2>'+
    (S.memorial.length
      ?'<div class="grid">'+S.memorial.map((m,i)=>heroCard(m,{mem:true,extra:
          '<div class="sub" style="margin-top:6px">Gen '+(i+1)+' · Fell on Floor <b style="color:var(--red)">'+m.diedFloor+'</b> to <b>'+m.killer+'</b><br>'+
          '<i>"'+m.epitaph+'"</i></div>'})).join('')+'</div>'
      :'<p class="hint">Empty. For now.</p>');
}

/* ============================== BATTLE ============================== */
function makeEnemies(n){
  if(n===10)return[{name:'THE EXECUTIONER 👹',maxHp:1300,hp:1300,atk:46,def:10,bounty:200,boss:true,step:0}];
  const scale=1+(n-1)*0.28,ascale=1+(n-1)*0.26,dscale=1+(n-1)*0.22;
  const count=n<=4?2:3;
  const list=[];
  for(let i=0;i<count;i++){
    let nm=MOBS[n-1],m=1;
    if(n>=6&&i===0){nm='Elite '+nm;m=1.5;}
    if(n===9)m*=1.1;
    list.push({name:nm,maxHp:Math.round(40*scale*m),hp:Math.round(40*scale*m),
      atk:Math.round(8*ascale*m),def:Math.round(2*dscale*m),bounty:Math.round((20+n*9)*m)});
  }
  return list;
}
function rawDmg(atk,mult,def){return Math.max(1,Math.round(atk*mult*rnd(.85,1.15)-def*0.6));}
function aliveH(){return B.heroes.filter(h=>h.hp>0);}
function aliveE(){return B.enemies.filter(e=>e.hp>0);}

function startFloor(n){
  const heroes=S.heroes.filter(h=>S.party.includes(h.id)).map(h=>Object.assign({},h,{expGain:0,killsGain:0}));
  B={floor:n,heroes,enemies:makeEnemies(n),turn:0,over:false,speed:1,deaths:[],marked:null,blind:n===10&&!S.knowledge.executioner};
  heroes.forEach(h=>{if(n===10)h.fear=clamp(h.fear+10,0,100);});
  $('battle').classList.remove('hidden');
  $('b-result').classList.add('hidden');
  $('b-log').innerHTML='';
  $('b-floor').textContent=n===10?'FLOOR 10 — THE WALL':'FLOOR '+n;
  log((n===10?'The stairwell ends. Something enormous is waiting.':'Floor '+n+' — the party advances.'),'sys');
  if(n===10&&!S.knowledge.executioner)log('The air is wrong here. Heroes grip their weapons tighter.','dim');
  renderBattle();
  runBattle();
}
function pause(){return new Promise(r=>setTimeout(r,600/B.speed));}
function log(t,cls){
  const d=$('b-log');
  d.innerHTML+=(cls?'<span class="'+cls+'">':'')+t.replace(/</g,'&lt;')+(cls?'</span>':'')+'\n';
  d.scrollTop=d.scrollHeight;
}
function unitHtml(u,isHero){
  const pct=clamp(Math.round(u.hp/u.maxHp*100),0,100);
  const marked=isHero&&B.marked===u&&u.hp>0;
  return '<div class="bunit'+(marked?' marked':'')+(u.hp<=0?' dead':'')+'">'+
    '<div class="u1"><span>'+(isHero?CLASSES[u.cls].icon+' ':'')+u.name+(marked?' 🎯':'')+'</span><span class="uhp">'+Math.max(0,Math.round(u.hp))+'/'+u.maxHp+'</span></div>'+
    '<div class="bar"><i class="'+(pct<35?'low':'')+'" style="width:'+pct+'%"></i></div></div>';
}
function renderBattle(){
  $('b-party').innerHTML=B.heroes.map(h=>unitHtml(h,true)).join('');
  $('b-enemies').innerHTML=B.enemies.map(e=>unitHtml(e,false)).join('');
}
function checkEnd(){
  if(B.over)return true;
  if(!aliveE().length){finish(true);return true;}
  if(!aliveH().length){finish(false);return true;}
  return false;
}
async function runBattle(){
  while(!B.over){
    B.turn++;
    for(const h of aliveH().slice().sort((a,b)=>b.agi-a.agi)){
      if(B.over||!aliveE().length)break;
      await heroAct(h);renderBattle();
      if(checkEnd())break;
      await pause();
    }
    if(B.over)break;
    for(const e of aliveE()){
      if(B.over||!aliveH().length)break;
      await enemyAct(e);renderBattle();
      if(checkEnd())break;
      await pause();
    }
    if(checkEnd())break;
    await pause();
  }
}
function fearCheck(h){
  if(h.personality==='Coward'&&h.fear>50&&Math.random()<0.35){log(h.name+' hesitates, frozen by fear...','dim');return true;}
  return false;
}
function loyaltyCheck(h){
  if(h.loyalty<30&&Math.random()<0.2){log(h.name+' refuses the order. ("Why should we die for you?")','bad');return true;}
  return false;
}
function hitEnemy(h,e,mult,tag){
  let m=mult;
  if(h.personality==='Brave'&&h.hp<h.maxHp*0.3)m*=1.25;
  if(h.personality==='Greedy')m*=1.1;
  if(h.personality==='Loyal'&&B.deaths.length)m*=1.2;
  if(h.personality==='Reckless')m*=1.15;
  const d=rawDmg(h.atk,m,e.def);
  e.hp-=d;
  log(h.name+' → '+(tag?tag+' ':'')+e.name+' for '+d+(tag?'!':''));
  if(e.hp<=0){e.hp=0;h.killsGain++;h.expGain+=e.bounty;log(e.name+' is slain.','good');}
}
async function heroAct(h){
  if(loyaltyCheck(h)||fearCheck(h))return;
  const es=aliveE();
  if(!es.length)return;
  if(h.cls==='Healer'){
    const allies=aliveH();
    let t;
    if(B.marked&&B.marked.hp>0&&S.knowledge.executioner&&B.marked.hp<B.marked.maxHp)t=B.marked; // learned: answer the mark
    else t=allies.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
    if(t.hp<t.maxHp){
      const heal=Math.round(18+h.atk*1.6+h.lvl*2);
      const before=t.hp;t.hp=Math.min(t.maxHp,t.hp+heal);
      log('✨ '+h.name+' heals '+t.name+' for '+(t.hp-before)+(t===B.marked?' (the mark answers to mercy)':''),'good');
    }else{
      const e=es.slice().sort((a,b)=>a.hp-b.hp)[0];
      hitEnemy(h,e,0.9,'smite');
    }
    return;
  }
  let mult=1,tag='',aoe=false,target=null;
  if(h.cls==='Warrior'&&Math.random()<0.3){mult=1.8;tag='Power Strike';}
  else if(h.cls==='Rogue'){target=es.slice().sort((a,b)=>a.hp-b.hp)[0];if(Math.random()<0.25){mult=1.7;tag='CRIT';}}
  else if(h.cls==='Mage'&&es.length>1&&Math.random()<0.4){aoe=true;mult=0.65;tag='Fireball';}
  else if(h.cls==='Tank')mult=0.8;
  if(aoe){log('🔮 '+h.name+' casts Fireball!','sys');for(const e of es.slice()){if(e.hp>0)hitEnemy(h,e,mult);}}
  else hitEnemy(h,target||pick(es),mult,tag);
}
function dmgHero(t,raw,srcName,opts){
  opts=opts||{};
  // Tank intercept
  if(!opts.noIntercept&&t.cls!=='Tank'){
    const tank=aliveH().find(x=>x.cls==='Tank'&&x!==t);
    if(tank&&Math.random()<0.3){log('🛡️ '+tank.name+' intercepts the blow meant for '+t.name+'!','sys');t=tank;}
  }
  let d;
  if(opts.lethal){d=9999;}
  else{
    d=Math.max(1,Math.round(raw-t.def*0.6));
    if(t.personality==='Cautious')d=Math.round(d*0.9);
    if(t.personality==='Reckless')d=Math.round(d*1.1);
  }
  t.hp-=d;
  if(t.hp<=0){
    t.hp=0;
    B.deaths.push(t);
    log('☠ '+srcName+' → '+t.name+' FALLS. '+t.name+' is gone.','bad');
    aliveH().forEach(x=>{x.fear=clamp(x.fear+15,0,100);x.loyalty=clamp(x.loyalty-8,0,100);});
  }else{
    log(srcName+' → '+t.name+' for '+d,'bad');
  }
}
async function enemyAct(e){
  const hs=aliveH();
  if(!hs.length)return;
  if(e.boss){bossAct(e);return;}
  let t;
  const tank=hs.find(h=>h.cls==='Tank');
  t=(tank&&Math.random()<0.45)?tank:pick(hs);
  dmgHero(t,Math.round(e.atk*rnd(.9,1.1)),e.name);
}
function bossAct(b){
  b.step++;
  const phase2=b.hp<b.maxHp*0.35;
  let hs=aliveH();
  if(!hs.length)return;
  if(b.step%3===2){
    B.marked=pick(hs);
    log('❗ THE EXECUTIONER fixes its gaze. '+B.marked.name+' has been MARKED.','sys');
    if(B.marked.personality==='Coward')log('"...no. No no no." — '+B.marked.name,'dim');
    hs.forEach(t=>dmgHero(t,Math.round(b.atk*0.4),'Creeping dread',{noIntercept:true}));
  }else if(b.step%3===0&&B.marked){
    const t=B.marked.hp>0?B.marked:pick(aliveH());
    if(t.hp>=t.maxHp){
      log('⛓ EXECUTION — the axe falls on '+t.name+'... and finds no weakness. (Full HP: the mark fizzles.)','good');
      dmgHero(t,Math.round(55+b.atk*0.5),'⛓ The axe',{noIntercept:true});
    }else{
      log('⛓ EXECUTION. The axe falls on '+t.name+'.','bad');
      dmgHero(t,0,'⛓ The Executioner',{lethal:true,noIntercept:true});
    }
    B.marked=null;
  }else{
    log('The Executioner raises its cleaver — it sweeps the whole party!','sys');
    const cm=phase2?1.05:0.85;
    aliveH().forEach(t=>dmgHero(t,Math.round(b.atk*cm),'Cleaver',{noIntercept:true}));
    if(phase2&&aliveH().length){
      log('The Executioner lunges, frenzied!','sys');
      dmgHero(pick(aliveH()),Math.round(b.atk*0.9),'A frenzied lunge');
    }
  }
}

function finish(win,retreated){
  if(B.over)return;
  B.over=true;
  const floor=B.floor,blind=B.blind;
  const deaths=[];
  // commit heroes
  for(const bh of B.heroes){
    const h=S.heroes.find(x=>x.id===bh.id);
    if(!h)continue;
    if(bh.hp<=0){
      deaths.push(bh);
      const mem=Object.assign({},bh,{diedFloor:floor,killer:floor===10?'The Executioner':'Floor '+floor+' denizens',
        epitaph:S.memorial.length===0?'First Blood — the first name the Tower took from you.':pick(EPITAPHS)});
      S.memorial.push(mem);
      S.heroes=S.heroes.filter(x=>x.id!==bh.id);
      S.party=S.party.filter(id=>id!==bh.id);
    }else{
      h.hp=bh.hp;
      h.fear=clamp(bh.fear,0,100);
      h.loyalty=clamp(bh.loyalty,0,100);
      if(!retreated){
        h.expGain=(bh.expGain||0)+(win?floor*15:0);
        h.kills+=bh.killsGain||0;
        if(win){h.loyalty=clamp(h.loyalty+4,0,100);h.floors++;}
        const lv=grantExp(h,h.expGain);
        if(lv>0)toast('⬆ '+h.name+' reaches Lv.'+h.lvl);
      }
    }
  }
  let rewardTxt='';
  if(win){
    const g=floor===10?600:40+25*floor;
    S.gold+=g;rewardTxt='💰 +'+g+' Gold';
    if(floor===10){S.permits+=3;rewardTxt+=' · 🎟️ +3 Permits';}
    else if(floor===3||floor===6||floor===9){S.permits+=1;rewardTxt+=' · 🎟️ +1 Permit';}
    S.cleared[floor]=true;
  }
  if(floor===10){
    if(!S.knowledge.executioner){S.knowledge.executioner=true;}
    if(win&&!S.knowledge.wallBroken){
      S.knowledge.wallBroken=true;
      toast('🏆 <b>The Wall Breaks.</b>');
      if(blind)toast('😱 You beat Floor 10 BLIND. Legendary.');
    }
    if(deaths.length&&!S.knowledge.firstBlood){S.knowledge.firstBlood=true;toast('🪦 <b>"First Time?"</b> — the Tower always collects.');}
  }else if(deaths.length&&!S.knowledge.firstBlood){
    S.knowledge.firstBlood=true;toast('🪦 <b>"First Time?"</b> — the Tower always collects.');
  }
  save();renderHeader();
  // result panel
  let html='<h3>'+(retreated?'Retreated.':win?'✓ FLOOR CLEARED':'☠ PARTY WIPED')+'</h3>';
  if(rewardTxt)html+='<p class="kv">'+rewardTxt+'</p>';
  if(win&&floor===10)html+='<p class="kv" style="color:var(--gold)">Beyond the Wall, the Tower keeps climbing. (For now, it waits.)</p>';
  deaths.forEach(d=>{html+='<p class="dead-line">🪦 '+d.name+' — Lv.'+d.lvl+' '+d.cls+' — fell on Floor '+floor+'</p>';});
  if(floor===10&&!retreated)html+='<p class="kv" style="margin-top:8px">📖 <b>Tower Analysis unlocked</b> — something in the Lobby remembers now.</p>';
  html+='<div class="rowbtns"><button class="act big" id="b-back">Return to Lobby</button></div>';
  const res=$('b-result');
  res.classList.remove('hidden');
  res.innerHTML=html;
  $('b-back').onclick=()=>{$('battle').classList.add('hidden');go('lobby');};
  renderBattle();
}
$('b-retreat').onclick=()=>{if(B&&!B.over)finish(false,true);};
document.querySelectorAll('.spd button[data-s]').forEach(b=>b.onclick=()=>{
  if(!B)return;B.speed=+b.dataset.s;
  document.querySelectorAll('.spd button[data-s]').forEach(x=>x.classList.toggle('on',x===b));
});

/* ============================== BOOT ============================== */
(function init(){
  S=loadSave()||newGame();
  if(!S.seenIntro){$('intro').classList.remove('hidden');}
  $('intro-go').onclick=()=>{S.seenIntro=true;save();$('intro').classList.add('hidden');};
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  render();
  selfTest();
})();

/* one runnable check: core math stays sane if this file is edited later */
function selfTest(){
  const assert=(c,m)=>{if(!c){console.error('[selftest] FAIL: '+m);return false;}return true;};
  let ok=true;
  for(let i=0;i<500;i++){
    const d=rawDmg(ri(5,60),rnd(.5,2),ri(0,25));
    ok=assert(d>=1,'rawDmg >= 1')&&ok;
  }
  S.nextId=9999;
  for(let i=0;i<200;i++){
    const r=rollRarity();
    ok=assert(r>=1&&r<=4,'rarity in 1..4')&&ok;
  }
  const h=makeHero();
  ok=assert(h.hp===h.maxHp&&h.maxHp>0&&h.atk>0,'hero sane')&&ok;
  ok=assert(expNeed(1)>0,'exp curve sane')&&ok;
  console.log('[selftest] '+(ok?'ok':'FAILED'));
}
